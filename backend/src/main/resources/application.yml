server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ailearn-vue-backend
  datasource:
    url: jdbc:mysql://localhost:3306/ailearn_vue?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

ailearn:
  jwt:
    secret: ailearn-vue-jwt-secret-key-2026-do-not-share
    expiration: 86400000
  cors:
    origins: http://localhost:5173,http://127.0.0.1:5173
